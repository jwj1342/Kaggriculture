# `kickstart: barnyard` is the NECESSARY condition for the warm-start
# collapse (money 40,682 -> 25,708, win -> 0.000 in one iteration), and
# f74fecd had already closed the --kickstart path because barnyard is a
# worse teacher than the learner. ed4ad4f then closed teacher CE at ANY
# teacher quality. Removal is verified equivalent to --ks-coef 0 by the
