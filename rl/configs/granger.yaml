B: 1024
iters: 240
algo: ppo
seat: alt
multi_head: true
opponents: barnyard
league: false
advance_at: 0.85
handicap: 0
win_bonus: 1.5
margin_bonus: 1.5
margin_scale: 50000
potential: future
build_bonus: 1.0
