# Round 4, assembled from four verdicts and one map:
#   - herdsman: FEED alone ratchets the wall margin (-48k era -> -36k)
#     but exploration never strings the animal chain together
#   - drover: teacher CE on the learner's own states moves earlier than
#     pure RL (the drift-immune imitation; parrot's pure BC froze)
#   - the 2x2: the pitchfork residual anchors every run to the melon
#     monoculture -- the 231k-season anatomy says that is the top meta's
#     SMALLEST revenue line (fertilizer 30% + wheat 21% + strawberry 17%)
#   - the literature: a 0%-win wall needs the win rate dragged into the
#     30-70% band; money handicap failed twice, so the ladder is OPPONENT
#     NOISE, annealed per chain link (a CLI arg, not pool state):
#
#   Historical L1 used --opp-noise 0.40.
#   L2: same with --opp-noise 0.25
#   L3: same with --opp-noise 0.10
#   L4+: same with --opp-noise 0.0
# This schedule is archived; new runs go through tools/submit_rl.py.
#
# NO residual_base on purpose (and since 2026-08-30, no kickstart either --
# see below): the build-curve credit provides the warm direction without
# the melon anchor. Hand heads still open AUTO-biased (the safe scheduler).
