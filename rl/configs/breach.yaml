# siege + the multi-head action space: the A/B siege set up. siege proved
# the gradient reaches the policy (margin-graded barnyard batches, 45M
# steps) and the macro space cannot spend it -- hands run a fixed cascade.
# breach gives the policy the labour force: per-hand task heads, AUTO-biased
# so iteration 0 plays exactly siege's scheduler and learns deviations.
# The one number this run is about: does barnyard's -48k margin move.
#
# Archived preset; submit any new derivative through tools/submit_rl.py.
device: cuda
B: 1024
iters: 240
algo: ppo
seat: alt
multi_head: true
residual_base: rl/out/pitchfork/weights.npz
opponents: starter,rl/out/pitchfork/weights.npz,barnyard
league: true
snapshot_every: 5
advance_at: 0.85
handicap: 800
win_bonus: 1.5
margin_bonus: 1.5
margin_scale: 50000
probe_every: 10
stop_patience: 6
