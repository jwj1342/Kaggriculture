# The first run with a real wall as a training opponent: curriculum
# starter -> pitchfork -> BARNYARD (tensorised, byte-exact vs the reference
# -- test_barn.py), handicap ladder per stage, bounded terminal margin so
# losing to barnyard by less is progress, league snapshots, residual policy
# over the pitchfork prior.
#
#   sbatch slurm/rl_train.sh --config rl/configs/siege.yaml \
#       --save rl/runs/siege/latest.pt --resume rl/runs/siege/latest.pt
#
# Context: foothold (RUNS.md 2026-08-19) proved self-play cannot leave its
# own basin; barnyard is the roster's nearest wall (margin -48k). This run
# is what the margin/handicap machinery was built for.
device: cuda
B: 1024
iters: 240
algo: ppo
seat: alt
residual_base: rl/out/pitchfork/weights.npz
opponents: starter,rl/out/pitchfork/weights.npz,barnyard
league: true
snapshot_every: 5
advance_at: 0.85
handicap: 800
win_bonus: 1.5
margin_bonus: 1.5
margin_scale: 50000
opp_noise: 0.0
# deterministic fixed-field probes drive best.pt and the early stopper
probe_every: 10
stop_patience: 6
