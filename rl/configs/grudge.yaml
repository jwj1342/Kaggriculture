# breach with a barnyard-only opponent pool: single-variable arm (b) of
# the 2x2 the breach verdict pre-registered (RUNS.md 2026-08-19).
# Hypothesis (b): POOL DYNAMICS -- in breach's stage 3 the mix was
# barnyard 0.5 / earlier anchors 0.25 / self-snapshots 0.25, and the
# beatable half owned the reward hill (the policy farmed 20-23k off
# snapshots while its barnyard margin drifted -48k -> -67k). Here 100%
# of batches are graded against the wall; league off, no snapshots.
# Deliberate overfitting to one opponent -- this is a diagnostic arm,
# the roster eval catches any collapse elsewhere. Everything else is
# byte-identical to breach.yaml.
#
#   sbatch slurm/rl_train.sh --config rl/configs/grudge.yaml \
#       --save rl/runs/grudge/latest.pt --resume rl/runs/grudge/latest.pt
device: cuda
B: 1024
iters: 240
algo: ppo
seat: alt
multi_head: true
residual_base: rl/out/pitchfork/weights.npz
opponents: barnyard
league: false
advance_at: 0.85
handicap: 800
win_bonus: 1.5
margin_bonus: 1.5
margin_scale: 50000
probe_every: 10
stop_patience: 6
