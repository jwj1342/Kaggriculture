# herdsman + --kickstart barnyard: the teacher-CE arm (Schmitt et al.;
# the Lux-S1 winner's recipe) on top of the FEED action space. barnyard_t
# labels every learner state with its own mapped decision (93% farmer /
# 100% market legality, gates K1-K3); the CE pull anneals to zero over
# 80M lane-steps while the RL loss runs from step one. A student that
# clones the teacher plays barnyard's mirror match -- ~50% -- which is
# where "打得有来有回" starts and RL takes over. Single variable vs
# herdsman: the kickstart.
#
# Archived preset; submit any new derivative through tools/submit_rl.py.
device: cuda
B: 1024
iters: 240
algo: ppo
seat: alt
multi_head: true
residual_base: rl/out/pitchfork/weights.npz
opponents: barnyard
league: false
advance_at: 0.85
handicap: 800
win_bonus: 1.5
margin_bonus: 1.5
margin_scale: 50000
potential: future
kickstart: barnyard
ks_coef: 0.5
ks_anneal: 80000000
probe_every: 10
stop_patience: 6
